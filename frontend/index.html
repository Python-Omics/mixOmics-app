<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:8501 ws://127.0.0.1:5173 http://localhost:5173 ws://localhost:5173;" />
    <title>Pythomics — Análisis multi-ómico</title>
    <style>
      /* Splash screen: visible hasta que React monte y lo oculte */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #F9FFFB; /* pharma-50 */
        z-index: 50;
        transition: opacity 200ms ease-out;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash .logo {
        font-size: 1.5rem;
        font-weight: 700;
        color: #1F3D2C; /* pharma-700 */
        letter-spacing: -0.02em;
      }
      #splash .tagline {
        font-size: 0.75rem;
        color: #64748b; /* slate-500 */
        margin-top: -0.5rem;
      }
      #splash .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #9BE7B1; /* pharma-200 */
        border-top-color: #2CB67D; /* pharma-400 */
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .spinner { animation: none; }
      }
    </style>
  </head>
  <body class="bg-pharma-50 text-slate-900">
    <!-- Splash screen: visible hasta que React monte -->
    <div id="splash" role="status" aria-live="polite">
      <div class="logo">Pythomics</div>
      <div class="tagline">Análisis multi-ómico</div>
      <div class="spinner" aria-hidden="true"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
