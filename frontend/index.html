<!DOCTYPE html>
<html lang="es" data-locale="es" data-theme="pharmacy-fresh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:8501 ws://127.0.0.1:5173 http://localhost:5173 ws://localhost:5173;" />
    <title>Pythomics — Análisis multi-ómico</title>
    <!--
      Anti-FOUC: aplica tema, idioma y título antes del primer paint.
      Script bloqueante (sin defer/async) en <head>, antes del bundle de
      React. Va como archivo externo y no inline porque la CSP tiene
      `script-src 'self'` sin `'unsafe-inline'`: un script inline queda
      bloqueado, uno del mismo origen no. Debe ir DESPUÉS del <title>
      para que el parser no lo sobrescriba con el valor estático.
    -->
    <script src="/app-init.js"></script>
    <style>
      /* Splash screen: visible hasta que React monte y lo oculte */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: var(--p-50, #F9FFFB); /* respeta el tema activo */
        z-index: 50;
        transition: opacity 200ms ease-out;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash .logo {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--p-700, #1F3D2C); /* respeta el tema activo */
        letter-spacing: -0.02em;
      }
      #splash .tagline {
        font-size: 0.75rem;
        color: #64748b; /* slate-500: neutro, fijo */
        margin-top: -0.5rem;
      }
      #splash .tagline::before {
        content: attr(data-tagline-es);
      }
      [data-locale='en'] #splash .tagline::before {
        content: attr(data-tagline-en);
      }
      #splash .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--p-200, #9BE7B1);
        border-top-color: var(--p-400, #2CB67D);
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .spinner { animation: none; }
      }
    </style>
  </head>
  <body class="bg-pharma-50 text-slate-900">
    <!-- Splash screen: visible hasta que React monte -->
    <div id="splash" role="status" aria-live="polite">
      <div class="logo">Pythomics</div>
      <div class="tagline" data-tagline-es="Análisis multi-ómico" data-tagline-en="Multi-omics analysis"></div>
      <div class="spinner" aria-hidden="true"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
